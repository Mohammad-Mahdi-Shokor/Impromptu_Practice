<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A polished impromptu speaking practice app that serves random questions from a CSV file."
    />
    <title>Impromptu</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section id="languageSelector" class="hero language-screen">
        <h1>Impromptu Speaking Practice</h1>
        <p class="language-prompt">Select your language:</p>
        <div class="language-buttons">
          <button id="englishBtn" class="primary" type="button">English</button>
          <button id="arabicBtn" class="primary" type="button">العربية</button>
        </div>
      </section>

      <section id="mainApp" class="app-content" style="display: none;">
        <section class="hero">
          <h1>Impromptu speaking practice</h1>
        </section>

        <section class="panel" aria-label="Random question practice area">
          <article class="card" aria-live="polite" aria-atomic="true">
            <!-- <p class="card__label">Your question</p> -->
            <h2 id="question">Preparing your first prompt…</h2>
          </article>

          <div class="controls">
            <button id="nextBtn" class="primary" type="button" disabled>New question</button>
            <button id="copyBtn" class="secondary" type="button" disabled>Copy question</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
